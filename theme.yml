variables:
  APPROVE_PACKAGE_FILE: "approval.txt"
  CICD_SCRIPTS_PATH: "./tooling/scripts/cicd"

  PIPELINE_IMAGE: "hiltidevelopment/pipeline-image-kitchen"
  PIPELINE_IMAGE_TAG: "latest"
  PIPELINE_IMAGE_ENTRYPOINT: "/usr/bin/kitchen_ci"

stages:
  - validate
  - package
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never

image:
    name: "${PIPELINE_IMAGE}:${PIPELINE_IMAGE_TAG}"
    entrypoint: ["/usr/bin/kitchen_ci"]

# default:
#   image: alpine:3.20
#   before_script:
#     - apk add --no-cache bash curl jq zip unzip
#     - chmod +x $CICD_SCRIPTS_PATH/*.sh


### --- Anchors --- ###
### Environments
# Used to target PROD environment using Linux docker runner
.env_prod_anchor: &env_prod
  variables:
    ENVIRONMENT: "prod"
  environment:
    name: production
  tags: [aws, type-docker, environment-dev]

# Used to target SANDBOX environment using Linux docker runner
.env_sandbox_anchor: &env_sandbox
  variables:
    ENVIRONMENT: "sandbox"
  environment:
    name: sandbox
  tags: [aws, type-docker, environment-dev]

### Anchors for scripts
.before_script_anchor: &before_script |
  # before_script
  - chmod +x $CICD_SCRIPTS_PATH/*.sh

### GateKeeper check approval
.check_approval_anchor: &check_approval
  - |
    ### We need JQ installed but do not know which image we're using Debian or Alpine
    DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -yq jq || true
    apk update && apk add -q jq || true
    echo "Checking if approval is needed."
    if [[ "$ENVIRONMENT" != "prod" ]]; then
      echo "Approval is not needed for deploy in the environment ${ENVIRONMENT^^}."
    else
      echo "Checking approval requrements for ${ENVIRONMENT^^} environment."
      HEADER="Private-Token: ${APPROVAL_CHECK_TOKEN}"
      NEED_APPROVE_PROD=$(curl -sS --header "${HEADER}" "${CI_API_V4_URL}/groups/${APPROVAL_GROUP_ID}/variables/NEED_APPROVE_PROD" | jq -r .value)
      echo "APPROVAL_PROJECT_ID=${APPROVAL_PROJECT_ID} APPROVAL_GROUP_ID=${APPROVAL_GROUP_ID} APPROVE_FOR_PROJECT=${APPROVE_FOR_PROJECT} NEED_APPROVE_PROD=${NEED_APPROVE_PROD}"
      if [[ "$NEED_APPROVE_PROD" == "null" ]]; then
        echo "ERROR: Can't find requirements for approval."
        echo "Make sure that group with ID ${APPROVAL_GROUP_ID} has CI/CD variable NEED_APPROVE_PROD defined."
        exit 1
      fi
      if [[ "$ENVIRONMENT" == "prod" && "$NEED_APPROVE_PROD" == "yes" ]];then
        CHECK_APPROVAL="yes"
      fi
      if [ "$CHECK_APPROVAL" != "yes" ]; then
        echo "Approval is not requred for deploy in the environment ${ENVIRONMENT^^}."
      else
        echo "Approval is needed for ${ENVIRONMENT^^}."
        echo "Checking approval..."
        PACKAGE_NAME="${APPROVE_FOR_PROJECT}_${ENVIRONMENT}"
        PACKAGE_VERSION=$(echo $CI_COMMIT_REF_NAME | tr '/.-' '___' )
        echo -n "Approval project url is "
        curl -sS --header "${HEADER}" "${CI_API_V4_URL}/projects/${APPROVAL_PROJECT_ID}" | jq -r .web_url
        APPROVED=$(curl -sS --header "${HEADER}" "${CI_API_V4_URL}/projects/${APPROVAL_PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&package_version=${PACKAGE_VERSION}" | jq -r .[0].created_at)
        if [ "$APPROVED" != "null" ]; then
          echo "Release ${CI_COMMIT_REF_NAME} is approved for deploy to ${ENVIRONMENT^^}."
          DOWNLOAD=$(curl -sS --header "${HEADER}" "${CI_API_V4_URL}/projects/${APPROVAL_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${APPROVE_PACKAGE_FILE}" -o "./${APPROVE_PACKAGE_FILE}" || echo "FAILED")
          if [ "$DOWNLOAD" != "FAILED" ]; then
            echo;echo "============================ APPROVAL CONTENT ============================"
            cat $APPROVE_PACKAGE_FILE
            echo;echo "=========================================================================="
          fi
        else
          echo;echo "========================= DEPLOY IS NOT APPROVED ========================="
               echo "Release ${CI_COMMIT_REF_NAME} is not approved yet for deploy to ${ENVIRONMENT^^}."
          echo "Restart this job again when deploy will be approved."
          echo;echo "=========================================================================="
          exit 1
        fi
      fi
    fi

### --- Job templates --- ###

default:
  before_script:
    - *before_script

### --- Jobs --- ###
validate_release:
  stage: validate
  <<: *env_prod
  script:
    - $CICD_SCRIPTS_PATH/validate.sh
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

package_theme:
  stage: package
  <<: *env_prod
  needs:
    - job: validate_release
      artifacts: true
  script:
    - $CICD_SCRIPTS_PATH/package.sh
  artifacts:
    name: "zendesk-theme-${RELEASE_VERSION}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/theme.zip
      - dist/manifest.json
      - build.env
    expire_in: 30 days

production_deploy:
  stage: deploy
  <<: *env_prod
  needs:
    - job: package_theme
      artifacts: true
  resource_group: zendesk-pe-production-theme
  variables:
    GIT_STRATEGY: none
  script:
    - *check_approval
    - $CICD_SCRIPTS_PATH/deploy.sh
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.sandbox_deploy:
  stage: deploy
  <<: *env_sandbox
  needs:
    - job: package_theme
      artifacts: true
  resource_group: zendesk-pe-sandbox-theme
  variables:
    GIT_STRATEGY: none
  script:
    - $CICD_SCRIPTS_PATH/deploy.sh
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure